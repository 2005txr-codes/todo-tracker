<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do tracker</title>
<style>
  :root {
    --bg: #eef2f4; --surface: #ffffff; --ink: #14262e; --muted: #5d7079;
    --line: #d3dde2; --accent: #1f6f78; --accent-ink: #ffffff; --warn: #b3412e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1b20; --surface: #172830; --ink: #e6eef1; --muted: #8fa5ae;
      --line: #2a414b; --accent: #4fb3bf; --accent-ink: #0f1b20; --warn: #ef8a76;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }
  #summary { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input[type="text"] { flex: 1 1 200px; }
  input, button { font: inherit; color: inherit; }
  input[type="text"], input[type="date"] {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px;
  }
  button {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .text { flex: 1; word-break: break-word; }
  .done .text { text-decoration: line-through; color: var(--muted); }
  .due { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .due.late { color: var(--warn); font-weight: 600; }
  li .del { border: 0; color: var(--muted); padding: 4px 8px; }
  li .del:hover { color: var(--warn); }
  .empty { padding: 24px 14px; text-align: center; color: var(--muted); }
  footer { margin-top: 12px; text-align: right; }
  footer button { border: 0; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { button { transition: background 0.15s, color 0.15s; } }
</style>
</head>
<body>
<main>
  <h1>To-do tracker</h1>
  <p id="summary" aria-live="polite"></p>

  <form id="add-form">
    <input type="text" id="text" placeholder="What needs doing?" aria-label="Task" maxlength="200" required>
    <input type="date" id="due" aria-label="Due date (optional)">
    <button class="primary" type="submit">Add task</button>
  </form>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button data-filter="all" aria-pressed="true">All</button>
    <button data-filter="active" aria-pressed="false">Active</button>
    <button data-filter="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>
  <footer><button id="clear">Clear completed</button></footer>
</main>

<script>
  const KEY = "todo-tracker:v1";
  let tasks = load();
  let filter = "all";

  const $ = (id) => document.getElementById(id);

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function render() {
    const list = $("list");
    list.textContent = "";
    const shown = tasks.filter(t =>
      filter === "all" || (filter === "done" ? t.done : !t.done));

    if (!shown.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = tasks.length ? "Nothing here. Try another filter." : "No tasks yet. Add your first one above.";
      list.appendChild(li);
    }

    shown.forEach(t => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";

      const box = document.createElement("input");
      box.type = "checkbox"; box.checked = t.done;
      box.setAttribute("aria-label", "Mark done: " + t.text);
      box.addEventListener("change", () => { t.done = box.checked; save(); render(); });

      const text = document.createElement("span");
      text.className = "text"; text.textContent = t.text;

      li.append(box, text);

      if (t.due) {
        const due = document.createElement("span");
        due.className = "due" + (!t.done && t.due < today() ? " late" : "");
        due.textContent = (due.className.includes("late") ? "Overdue " : "Due ") + t.due;
        li.appendChild(due);
      }

      const del = document.createElement("button");
      del.className = "del"; del.textContent = "Delete";
      del.setAttribute("aria-label", "Delete task: " + t.text);
      del.addEventListener("click", () => { tasks = tasks.filter(x => x.id !== t.id); save(); render(); });
      li.appendChild(del);

      list.appendChild(li);
    });

    const left = tasks.filter(t => !t.done).length;
    $("summary").textContent = tasks.length
      ? left + " of " + tasks.length + " tasks left"
      : "Plan your day, one task at a time.";
    $("clear").hidden = !tasks.some(t => t.done);
  }

  $("add-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("text").value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now(), text, due: $("due").value, done: false });
    save();
    $("text").value = ""; $("due").value = "";
    render();
    $("text").focus();
  });

  document.querySelectorAll(".filters button").forEach(b =>
    b.addEventListener("click", () => {
      filter = b.dataset.filter;
      document.querySelectorAll(".filters button").forEach(x =>
        x.setAttribute("aria-pressed", String(x === b)));
      render();
    }));

  $("clear").addEventListener("click", () => {
    tasks = tasks.filter(t => !t.done); save(); render();
  });

  render();
</script>
</body>
</html>
